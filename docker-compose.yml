version: "3.8"

networks:
  honeypot_net:
    driver: bridge
  soc_internal_net:
    driver: bridge

volumes:
  mysql_data:
    # New installs create mysql_data. Existing installs must explicitly point
    # this at their verified data volume and set MYSQL_DATA_VOLUME_EXTERNAL=true.
    name: ${MYSQL_DATA_VOLUME_NAME:-mysql_data}
    external: ${MYSQL_DATA_VOLUME_EXTERNAL:-false}
  pipeline_state:

services:
  # 1. CSDL MySQL (Tham gia CẢ 2 MẠNG để Web bẫy & Dashboard đều truy cập được)
  database:
    build:
      context: .
      dockerfile: Dockerfile.database
    container_name: honeypot_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_webhoneypot_db}
      MYSQL_USER: ${MYSQL_USER:-honeypot_pipeline}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: ["mysqld", "--port=${MYSQL_PORT:-3306}"]
    ports:
      - "${MYSQL_PORT:-3306}:${MYSQL_PORT:-3306}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - honeypot_net # <-- BỔ SUNG DÒNG NÀY
      - soc_internal_net

  # 2. Web Bẫy PHP
  decoy_web:
    build:
      context: .
      dockerfile: Dockerfile.decoy
    container_name: honeypot_decoy_web
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-database}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-honeypot_pipeline}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_webhoneypot_db}
    ports:
      - "8080:80"
    volumes:
      - ./1_decoy_web/logs:/var/www/html/logs
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - honeypot_net

  # 3. Lõi AI FastAPI
  ai_engine:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: honeypot_ai_engine
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MYSQL_HOST: ${MYSQL_HOST:-database}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-honeypot_pipeline}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_webhoneypot_db}
      AI_MODEL_RELEASE: ${AI_MODEL_RELEASE:?Set AI_MODEL_RELEASE in .env to a published release version}
      AI_MODEL_CANDIDATE: ${AI_MODEL_CANDIDATE:?Set AI_MODEL_CANDIDATE in .env to alternative or baseline}
    volumes:
      - ./3_ai_engine/artifacts/releases:/app/artifacts/releases:ro
    networks:
      - soc_internal_net

  # 4. Log Pipeline & Email Alert
  log_pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: honeypot_log_pipeline
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-database}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-honeypot_pipeline}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_webhoneypot_db}
    volumes:
      - ./1_decoy_web/logs:/app/logs:ro
      - pipeline_state:/app/state
    depends_on:
      - database
      - ai_engine
    networks:
      - honeypot_net
      - soc_internal_net

  # 5. SOC Dashboard ReactJS
  frontend_dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:8000}
    container_name: honeypot_dashboard
    ports:
      - "3000:80"
    depends_on:
      - database
    networks:
      - soc_internal_net

  # 6. Attacker Console
  attacker_console:
    build:
      context: .
      dockerfile: Dockerfile.attacker
    container_name: honeypot_attacker_console
    ports:
      - "8081:80"
    networks:
      - honeypot_net

  pentest_agent:
    build:
      context: .
      dockerfile: Dockerfile.pentest-agent
    container_name: honeypot_pentest_agent
    ports:
      - "8082:8000"
    networks:
      - honeypot_net
